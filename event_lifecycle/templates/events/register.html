{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Quick Registration</h1>
        <p class="text-muted">Upload receipt (jpg/png/pdf, <2MB) and user photo (jpg/png, <2MB).</p>
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
