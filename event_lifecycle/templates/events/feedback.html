{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div style="margin-bottom:1.5rem;">
      <h1 style="font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:var(--ink);">Feedback</h1>
      <p style="color:var(--ink-3);font-size:.875rem;margin:.2rem 0 0;">For <strong>{{ participant.name }}</strong></p>
    </div>
    <div class="card">
      <div class="card-header-accent"><i class="bi bi-chat-left-text-fill"></i> Submit Feedback</div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
          </div>
          {% endfor %}
          <button class="btn btn-primary w-100 mt-2" type="submit">
            <i class="bi bi-send-fill me-1"></i> Submit Feedback
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
