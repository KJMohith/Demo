{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventFlow — Lifecycle Manager</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/eventflow.css' %}" rel="stylesheet">
</head>
<body>

<nav class="topbar">
  <a class="topbar-brand" href="{% url 'dashboard' %}">
    <span class="brand-logo">⚡</span>
    EventFlow
  </a>
  <div class="topbar-right">
    <span class="live-pill"><span class="live-dot"></span>LIVE</span>
    <nav class="topbar-nav">
      <a href="{% url 'dashboard' %}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
      <a href="{% url 'register' %}"><i class="bi bi-person-plus-fill"></i> Register</a>
    </nav>
  </div>
</nav>

<div class="page-wrapper">
  {% block content %}{% endblock %}
</div>

<div id="toast-container"></div>

<script>
function showToast(msg, type) {
  type = type || 'success';
  var icons = { success: 'check-circle-fill', error: 'exclamation-triangle-fill', info: 'info-circle-fill' };
  var t = document.createElement('div');
  t.className = 'toast-msg ' + type;
  t.innerHTML = '<i class="bi bi-' + (icons[type] || 'info-circle-fill') + '"></i><span>' + msg + '</span>';
  document.getElementById('toast-container').appendChild(t);
  setTimeout(function () {
    t.style.transition = 'all .3s';
    t.style.opacity = '0';
    t.style.transform = 'translateX(16px)';
    setTimeout(function () { t.remove(); }, 320);
  }, 3500);
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
