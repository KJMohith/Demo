<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Lifecycle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at top left, #e1f2ff 10%, #f4e8ff 40%, #fff1d6 100%);
      min-height: 100vh;
    }
    .navbar {
      background: linear-gradient(90deg, #3b34f5, #0d9ff6) !important;
    }
    .navbar-brand { font-weight: 800; letter-spacing: .4px; }
    .card {
      border: 0;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(32, 45, 102, .09) !important;
    }
    .btn-primary {
      background: linear-gradient(90deg, #6a4cff, #1f9dff);
      border: 0;
    }
    .btn-dark {
      background: linear-gradient(90deg, #1f2a44, #3b4f7d);
      border: 0;
    }
    .table thead th {
      background: #f0f4ff;
      color: #24345f;
      border-bottom: 0;
    }
    .table tbody tr {
      border-color: #edf1ff;
    }
    .table tbody tr:hover {
      background: #f9fbff;
    }
    .form-control,
    .form-select {
      border-radius: 10px;
      border: 1px solid #d7e1ff;
      box-shadow: none;
    }
    .form-control:focus,
    .form-select:focus {
      border-color: #7b9dff;
      box-shadow: 0 0 0 .2rem rgba(77, 120, 255, .15);
    }
    .list-group-item {
      background: transparent;
      border-color: #ecf0ff;
    }
    .btn {
      border-radius: 10px;
    }
    .card-body h5,
    .card-body h6 {
      color: #22376c;
      font-weight: 700;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Event Lifecycle</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
      <a class="nav-link" href="{% url 'register' %}">Quick Register</a>
    </div>
  </div>
</nav>
<div class="container pb-4">{% block content %}{% endblock %}</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
